[project]
name = "shabana-smart-sort"
version = "1.1.0"
description = "Intelligent, safe, rule-driven folder organizer for Windows"
authors = [{ name = "Shabana Smart Sort Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "pydantic>=2.5.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
content-index = [
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
]

[build-system]
requires = ["setuptools>=65.0.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
